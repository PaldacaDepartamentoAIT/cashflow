# Coolify: solo la app. Traefik hace de proxy y PostgreSQL es un recurso aparte.
#
# En Coolify: Build Pack = Docker Compose, fichero = docker-compose.coolify.yml
# Asigna el dominio al servicio `web` (puerto 8081). No publiques 80/443 aquí.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      DJANGO_ENV: production
      DEBUG: "0"
      TZ: America/Caracas
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - app_logs:/app/logs
      - app_static:/app/staticfiles

volumes:
  app_logs:
  app_static:
