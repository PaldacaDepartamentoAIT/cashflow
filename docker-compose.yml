services:
  web:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cashflow_db}
      MARIADB_USER: ${DB_USER:-cashflow}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
  logs_data:
