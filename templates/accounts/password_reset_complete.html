{% extends 'base.html' %}
{% load static %}

{% block title %}Contraseña Actualizada - Control de Gastos{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/accounts/auth.css' %}">
{% endblock %}

{% block content %}
<div class="cf-card auth-card">
    <div class="cf-card__body">
        <div class="cf-text-center cf-mb-4">
            <i class="fa-solid fa-circle-check auth-logo" style="color: var(--color-success);"></i>
            <h3 class="auth-title">Contraseña actualizada</h3>
            <p class="auth-subtitle">Ya puedes entrar con tu nueva contraseña</p>
        </div>

        <a href="{% url 'login' %}" class="cf-btn cf-btn--primary cf-btn--lg cf-mt-4">
            <span class="cf-fw-bold">Iniciar sesión</span>
            <i class="fa-solid fa-right-to-bracket"></i>
        </a>
    </div>
</div>
{% endblock %}
